name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a running build on main: each merge must finish and publish its release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  test:
    name: EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: MediaPipe download cache
        uses: actions/cache@v4
        with:
          path: |
            app/Packages/com.github.homuler.mediapipe-0.16.3.tgz
            app/Assets/StreamingAssets/hand_landmarker.task
          key: mediapipe-0.16.3-${{ hashFiles('scripts/fetch-mediapipe.sh') }}
      - name: Fetch MediaPipe package and hand model
        run: scripts/fetch-mediapipe.sh
      - uses: actions/cache@v4
        with:
          path: app/Library
          key: Library-test-${{ hashFiles('app/Assets/**', 'app/Packages/**', 'app/ProjectSettings/**') }}
          restore-keys: |
            Library-test-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          projectPath: app
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: MediaPipe download cache
        uses: actions/cache@v4
        with:
          path: |
            app/Packages/com.github.homuler.mediapipe-0.16.3.tgz
            app/Assets/StreamingAssets/hand_landmarker.task
          key: mediapipe-0.16.3-${{ hashFiles('scripts/fetch-mediapipe.sh') }}
      - name: Fetch MediaPipe package and hand model
        run: scripts/fetch-mediapipe.sh
      - uses: actions/cache@v4
        with:
          path: app/Library
          key: Library-Android-${{ hashFiles('app/Assets/**', 'app/Packages/**', 'app/ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
      - name: Work out version
        id: ver
        run: |
          VERSION="$(tr -d ' \r\n' < VERSION).${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, version code ${{ github.run_number }}"
      - name: Check release signing secrets (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          S1: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          S2: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          S3: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          S4: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          fail=0
          [ -n "$S1" ] || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing"; fail=1; }
          [ -n "$S2" ] || { echo "::error::Secret ANDROID_KEYSTORE_PASS is missing"; fail=1; }
          [ -n "$S3" ] || { echo "::error::Secret ANDROID_KEYALIAS_NAME is missing"; fail=1; }
          [ -n "$S4" ] || { echo "::error::Secret ANDROID_KEYALIAS_PASS is missing"; fail=1; }
          if [ "$fail" = 1 ]; then
            echo "::error::Release signing secrets are missing. Follow docs/guides/release-key.md, then re-run this job. Refusing to publish an unsigned release."
            exit 1
          fi
      - uses: game-ci/unity-builder@v4
        with:
          projectPath: app
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: DiyVr.EditorTools.CiBuild.BuildAndroid
          buildName: diy-vr
          versioning: Custom
          version: ${{ steps.ver.outputs.version }}
          androidVersionCode: ${{ github.run_number }}
          androidKeystoreName: ${{ github.event_name == 'push' && 'release.p12' || '' }}
          androidKeystoreBase64: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          androidKeystorePass: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_PASS || '' }}
          androidKeyaliasName: ${{ github.event_name == 'push' && secrets.ANDROID_KEYALIAS_NAME || '' }}
          androidKeyaliasPass: ${{ github.event_name == 'push' && secrets.ANDROID_KEYALIAS_PASS || '' }}
      - name: Check the APK manifest has what the updater needs
        run: |
          APK="$(find build/Android -name '*.apk' | head -n 1)"
          [ -n "$APK" ] || { echo "::error::No APK found"; exit 1; }
          unzip -p "$APK" AndroidManifest.xml > /tmp/manifest.bin
          python3 - <<'PY'
          import sys
          d = open('/tmp/manifest.bin', 'rb').read()
          missing = [s for s in ['android.permission.REQUEST_INSTALL_PACKAGES', 'androidx.core.content.FileProvider']
                     if s.encode('utf-16-le') not in d and s.encode() not in d]
          if missing:
              print('::error::APK manifest is missing: ' + ', '.join(missing) + ' (the in-app updater cannot install updates)')
              sys.exit(1)
          print('APK manifest OK: install permission and FileProvider present')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: diy-vr-android-apk
          path: build/Android
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: diy-vr-android-apk
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d ' \r\n' < VERSION).${{ github.run_number }}"
          TAG="v$VERSION"
          PREV="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          git log -n 30 --no-merges --pretty='- %s' "$RANGE" > notes.md
          [ -s notes.md ] || echo "- No changes listed" > notes.md
          APK="$(ls dist/*.apk | head -n1)"
          cp "$APK" "dist/diy-vr-$VERSION.apk"
          gh release create "$TAG" "dist/diy-vr-$VERSION.apk" \
            --title "DIY VR $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
