name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  test:
    name: EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: app/Library
          key: Library-test-${{ hashFiles('app/Assets/**', 'app/Packages/**', 'app/ProjectSettings/**') }}
          restore-keys: |
            Library-test-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          projectPath: app
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: app/Library
          key: Library-Android-${{ hashFiles('app/Assets/**', 'app/Packages/**', 'app/ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
      - uses: game-ci/unity-builder@v4
        with:
          projectPath: app
          targetPlatform: Android
          androidExportType: apk
          buildMethod: DiyVr.EditorTools.CiBuild.BuildAndroid
          buildName: diy-vr
          versioning: None
      - uses: actions/upload-artifact@v4
        with:
          name: diy-vr-android-apk
          path: build/Android
          if-no-files-found: error
