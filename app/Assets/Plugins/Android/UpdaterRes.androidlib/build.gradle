apply plugin: 'com.android.library'

dependencies {
    // Provides androidx.core.content.FileProvider (declared in this library's AndroidManifest.xml).
    implementation 'androidx.core:core:1.13.1'
}

android {
    namespace "com.diyvr.updater"
    compileSdk 35

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
